# Read by SonarCloud Automatic Analysis (no coverage import in that mode).
# The CI job uses sonar-project.properties instead; keep the two in sync.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,apps/api/src/testing/**
# shadcn.css is vendored Tailwind syntax that Sonar's CSS parser does not understand.
sonar.exclusions=**/*.test.ts,**/*.test.tsx,apps/api/src/testing/**,apps/web/src/styles/shadcn.css,apps/web/public/**,docs/design/**
sonar.cpd.exclusions=apps/web/src/components/ui/**

# The reduced-motion reset in index.css must beat every animation, including unlayered library
# styles (vaul's drawer): !important is the standard way to do that, not a specificity bug.
sonar.issue.ignore.multicriteria=motion
sonar.issue.ignore.multicriteria.motion.ruleKey=css:S9423
sonar.issue.ignore.multicriteria.motion.resourceKey=apps/web/src/index.css
