<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AnyPay</title>
    <meta name="description" content="Pay any spaza from any wallet, even offline." />
    <meta name="theme-color" content="#f5f2ea" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AnyPay" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Blocking on purpose: sets the theme before first paint. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown while the first screen loads on a slow connection; removed as it paints (useHideSplash). -->
    <div id="splash" class="splash" aria-hidden="true">
      <svg viewBox="0 0 512 512">
        <rect width="512" height="512" rx="120" fill="#1f4d3a" />
        <path
          d="M160 376 256 136l96 240M196 296h120"
          fill="none"
          stroke="#f5f2ea"
          stroke-width="52"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>
    <noscript>AnyPay needs JavaScript turned on.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
