# Used by the CI SonarCloud job (needs the SONAR_TOKEN secret and Automatic Analysis turned off).
# SonarCloud's Automatic Analysis reads .sonarcloud.properties instead; keep the two in sync.
sonar.organization=whiteskytk
sonar.projectKey=WhiteSkyTK_anypay
sonar.projectName=AnyPay

sonar.sources=apps/web/src,apps/api/src,packages/shared/src,.github
sonar.tests=apps/web/src,apps/api/src,packages/shared/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,apps/api/src/testing/**
# shadcn.css is vendored Tailwind syntax that Sonar's CSS parser does not understand.
sonar.exclusions=**/*.test.ts,**/*.test.tsx,apps/api/src/testing/**,apps/web/src/styles/shadcn.css

# shadcn/ui components are vendored code, so they are not counted towards coverage or duplication.
sonar.coverage.exclusions=apps/web/src/components/ui/**,apps/web/src/main.tsx,apps/api/src/server.ts,apps/api/src/cli/**,**/*.d.ts
sonar.cpd.exclusions=apps/web/src/components/ui/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
