sonar.organization=whiteskytk
sonar.projectKey=WhiteSkyTK_anypay
sonar.projectName=AnyPay

sonar.sources=apps/web/src,apps/api/src,packages/shared/src
sonar.tests=apps/web/src,apps/api/src,packages/shared/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*.test.ts,**/*.test.tsx

# shadcn/ui components are vendored code, so they are not counted towards coverage or duplication.
sonar.coverage.exclusions=apps/web/src/components/ui/**,apps/web/src/main.tsx,apps/api/src/server.ts,**/*.d.ts
sonar.cpd.exclusions=apps/web/src/components/ui/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
